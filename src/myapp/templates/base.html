<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Preguntas y Respuestas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header>
        <strong>Preguntas y Respuestas</strong>
        <nav>
            <a href="{{ url_for('preguntas.index') }}">Preguntas</a>
            <a href="{{ url_for('users.index') }}">Usuarios</a>
        </nav>
    </header>

    <main>
        {% for message in get_flashed_messages() %}
            <p class="flash" role="status">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
