[project]
name = "taller-isi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Santi Juarez", email = "santijuares2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
taller-isi = "taller_isi:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-name = "myapp"
module-root = "src"
