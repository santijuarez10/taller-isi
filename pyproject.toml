[project]
name = "taller-isi"
version = "0.1.0"
description = "Plataforma de preguntas y respuestas hecha con Flask"
readme = "README.md"
authors = [
    { name = "Santi Juarez", email = "santijuares2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.10",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-name = "myapp"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]