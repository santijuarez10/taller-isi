{% extends "base.html" %}

{% block title %}Usuarios{% endblock %}

{% block content %}
    <h1>Listado de usuarios</h1>
    <p><a class="button" href="{{ url_for('users.new') }}">Nuevo usuario</a></p>

    <ul class="list">
        {% for user in users %}
            <li>
                <a href="{{ url_for('users.detail', user_id=user.id) }}">{{ user.name }}</a>
                <span class="muted">{{ user.email }}</span>
            </li>
        {% else %}
            <li>Todavía no hay usuarios.</li>
        {% endfor %}
    </ul>
{% endblock %}
